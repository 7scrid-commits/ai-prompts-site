<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resource Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
overflow:hidden;
}

.orb{
position:absolute;
border-radius:50%;
filter:blur(80px);
animation:float 8s ease-in-out infinite;
}

.orb1{
width:300px;
height:300px;
background:#00ffff;
top:10%;
left:10%;
}

.orb2{
width:350px;
height:350px;
background:#8b5cf6;
bottom:10%;
right:10%;
animation-delay:2s;
}

@keyframes float{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-40px);
}
}

.content{
position:relative;
z-index:2;
max-width:900px;
padding:20px;
}

.badge{
display:inline-block;
padding:10px 18px;
border:1px solid rgba(255,255,255,.2);
border-radius:30px;
background:rgba(255,255,255,.05);
margin-bottom:25px;
}

h1{
font-size:70px;
line-height:1.1;
margin-bottom:20px;
}

.gradient{
background:linear-gradient(90deg,#00ffff,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
font-size:20px;
line-height:1.8;
opacity:.85;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
background:linear-gradient(90deg,#00ffff,#8b5cf6);
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

@media(max-width:768px){

h1{
font-size:42px;
}

p{
font-size:16px;
}

}

</style>

</head>

<body>

<section class="hero">

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="content">

<div class="badge">
🚀 Next Generation AI Platform
</div>

<h1>
Discover The Future Of
<span class="gradient">Artificial Intelligence</span>
</h1>

<p>
Explore AI tools, prompts, templates and resources designed
for creators, entrepreneurs and professionals worldwide.
</p>

<a href="ai-tools.html" class="btn">
Explore AI Tools
</a>

</div>

</section>

</body>
</html>
